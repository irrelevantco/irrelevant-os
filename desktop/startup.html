<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><title>Opening iRRELEVANT OS</title><style>html{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a08;color:#f0f0e8;font-family:Arial,Helvetica,sans-serif}.startup{width:min(420px,85vw);padding:40px;border:.5px solid #d6f55b45;border-radius:16px}.mark{display:grid;place-items:center;width:48px;height:48px;background:#d6f55b;color:#101110;border-radius:6px;font-size:27px;font-weight:bold}h1{font-family:Georgia,serif;font-weight:400;font-size:32px;letter-spacing:-1px;margin:32px 0 15px}p{color:#a5a79b;font-size:14px;line-height:1.6}progress{display:block;width:100%;height:3px;margin:28px 0 18px;border:0;background:#24281f;accent-color:#d6f55b}progress::-webkit-progress-bar{background:#24281f}progress::-webkit-progress-value{background:#d6f55b;transition:width .18s ease}small{color:#868b7b;font-size:11px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="startup"><div class="mark" aria-hidden="true">iR</div><h1>Opening your workspace.</h1><p id="startup-status" role="status" aria-live="polite">Preparing iRRELEVANT OS…</p><progress id="startup-progress" max="100" value="5" aria-label="Workspace startup"></progress><small>Build your position.</small></main></body></html>

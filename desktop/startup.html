<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Opening iRRELEVANT OS</title>
    <style>
      html {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 100%, #d6f55b08, transparent 65%),
          #101110;
        color: #eeeee7;
        font-family: Arial, Helvetica, sans-serif;
      }
      .startup {
        width: min(420px, 85vw);
        padding: 32px 0;
        animation: arrive 0.3s ease-out;
      }
      .mark {
        width: 56px;
        height: 56px;
      }
      .mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .eyebrow {
        margin-top: 32px;
        color: #979b90;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 400;
        font-size: 44px;
        letter-spacing: -2px;
        margin: 12px 0 30px;
      }
      p {
        color: #979b90;
        font-size: 14px;
        line-height: 1.6;
      }
      progress {
        display: block;
        width: 100%;
        height: 2px;
        margin: 0 0 18px;
        border: 0;
        background: #30332a;
        accent-color: #d6f55b;
      }
      progress::-webkit-progress-bar {
        background: #30332a;
      }
      progress::-webkit-progress-value {
        background: #d6f55b;
        transition: width 0.22s ease-out;
      }
      small {
        display: block;
        margin-top: 32px;
        color: #979b90;
        font-size: 11px;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="startup">
      <div class="mark">
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 64 64"
        >
          <rect width="64" height="64" rx="7" fill="#d7ff5f" />
          <g fill="#101110" transform="translate(0 -4)">
            <path d="M8 20h7v7H8zm0 10h7v25H8z" />
            <path
              fill-rule="evenodd"
              d="M21 20h11c8 0 12 4 12 12 0 5-3 8-7 10l10 13H37l-8-11h-1v11h-7V20zm7 7v10h4c4 0 6-2 6-5s-2-5-6-5h-4z"
            />
            <path d="M49 20h10v10h-4v-3l-6 6-3-3 6-6h-3z" />
          </g>
        </svg>
      </div>
      <p class="eyebrow">iRRELEVANT OS / PERSONAL DESKTOP</p>
      <h1>Build your position.</h1>
      <progress
        id="startup-progress"
        max="100"
        value="5"
        aria-label="Workspace startup"
      ></progress>
      <p id="startup-status" role="status" aria-live="polite">
        Preparing iRRELEVANT OS…
      </p>
      <small>Your workspace is opening.</small>
    </main>
  </body>
</html>

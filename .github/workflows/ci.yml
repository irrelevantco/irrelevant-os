name: Acquisition CRM checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run local:env
      - run: npm run local:up
      - run: npm run local:migrate
      - run: npm run test:rls
      - run: npm run test:imports
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 3
      - if: always()
        run: npm run local:down

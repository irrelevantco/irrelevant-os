name: Acquisition CRM checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run local:env
      - run: npm run local:up
      - run: npm run local:migrate
      - run: npm run test:rls
      - run: npm run test:imports
      - run: npm run test:agents
      - run: npm run test:acquisition
      - run: npm run test:lead-trash
      - run: npm run test:upgrade
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 3
      - if: always()
        run: npm run local:down
  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm.cmd ci
        shell: pwsh
      - name: Verify native Windows listener on port 3030
        shell: pwsh
        run: |
          $outLog = Join-Path $env:RUNNER_TEMP 'irrelevant-next-out.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'irrelevant-next-err.log'
          $server = Start-Process -FilePath (Get-Command node).Source -ArgumentList @('scripts/dev.mjs', '--hostname', '127.0.0.1', '--port', '3030') -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($server.HasExited) { throw 'Next.js exited before accepting connections.' }
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:3030' -TimeoutSec 3
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'No HTTP 200 response from Windows port 3030.' }
            Write-Host 'Native Windows startup verified: HTTP 200 at http://127.0.0.1:3030'
          } finally {
            if (-not $server.HasExited) { taskkill /PID $server.Id /T /F }
            if (Test-Path $outLog) { Get-Content $outLog -Tail 40 }
            if (Test-Path $errLog) { Get-Content $errLog -Tail 40 }
          }

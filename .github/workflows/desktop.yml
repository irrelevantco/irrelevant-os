name: Personal Windows application
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd run build
      - name: Package pinned Electron and standalone application
        run: python scripts/package-desktop.py --platform win32
      - name: Verify native Windows desktop startup
        shell: pwsh
        run: |
          $env:DESKTOP_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'work\desktop-release\iRRELEVANT-OS-win32-x64\iRRELEVANT OS.exe'
          node tests/desktop/smoke.mjs
      - name: Check free provider connectivity (one bounded lookup, no import)
        run: node --import tsx scripts/verify-free-discovery.ts
      - uses: actions/upload-artifact@v4
        with:
          name: iRRELEVANT-OS-Windows-x64-v0.3.0
          path: |
            work/desktop-release/*.zip
            work/desktop-release/*.sha256
            work/free-discovery-check.json
          retention-days: 3
      - name: Require CRM checks for this exact commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $verified = $false
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            $runs = gh run list --workflow ci.yml --commit $env:GITHUB_SHA --limit 1 --json status,conclusion | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify repository checks.' }
            if ($runs.Count -gt 0 -and $runs[0].status -eq 'completed') {
              if ($runs[0].conclusion -ne 'success') { throw 'CRM checks did not pass for this commit.' }
              $verified = $true
              break
            }
            Write-Host 'Waiting for CRM checks on this commit...'
            Start-Sleep -Seconds 15
          }
          if (-not $verified) { throw 'CRM checks did not complete within the release window.' }
      - name: Publish the verified personal preview download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem 'work/desktop-release/*.zip' | Select-Object -First 1
          $checksum = Get-ChildItem 'work/desktop-release/*.sha256' | Select-Object -First 1
          gh release create v0.3.0-personal-preview $archive.FullName $checksum.FullName --target $env:GITHUB_SHA --prerelease --title 'iRRELEVANT OS — Controlled Acquisition + Appointments' --notes-file docs/PERSONAL_RELEASE_NOTES.md

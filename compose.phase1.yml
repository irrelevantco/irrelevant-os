# Optional lightweight local stack for Phase 1. Not a production hosting recipe.
# Uses Supabase Auth (GoTrue), PostgREST, and PostgreSQL with the same RLS migration.
name: irrelevant-phase1
services:
  db:
    image: postgres:15.15-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run local:env}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports: ["127.0.0.1:54322:5432"]
    volumes:
      - phase1-db:/var/lib/postgresql/data
      - ./local-stack/roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.184.0
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, --spider, http://127.0.0.1:9999/health]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3030
      GOTRUE_URI_ALLOW_LIST: http://localhost:3030/auth/callback
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Run npm run local:env}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_RATE_LIMIT_SIGN_UPS: 100
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 200
  rest:
    image: public.ecr.aws/supabase/postgrest:v14.1
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: 1000
  gateway:
    image: nginx:1.29-alpine
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_started }
    ports: ["127.0.0.1:54321:80"]
    volumes: ["./local-stack/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
volumes:
  phase1-db:

server {
  listen 80;
  server_tokens off;
  client_max_body_size 1m;
  location /auth/v1/ { proxy_pass http://auth:9999/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /rest/v1/ { proxy_pass http://rest:3000/; proxy_set_header Host $host; }
  location = /health { return 200 'ok'; add_header Content-Type text/plain; }
  location / { return 404; }
}
